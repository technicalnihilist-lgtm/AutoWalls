name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; just make sure the
      # platform and build-tools this project targets are present.
      - name: Ensure Android SDK packages
        run: |
          SDKMGR="$(find "${ANDROID_HOME}" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Render screenshots from the real Compose screens
        run: ./gradlew :app:testDebugUnitTest --tests "*ScreenshotTest*" --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoWalls-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore
