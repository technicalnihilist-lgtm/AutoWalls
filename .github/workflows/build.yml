name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Render screenshots from the real Compose screens
        run: ./gradlew :app:testDebugUnitTest --tests "*ScreenshotTest*" --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoWalls-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore
